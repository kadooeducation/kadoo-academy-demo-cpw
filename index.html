<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kadoo Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
<script>
  // tema antes da pintura (evita piscar): preferência salva > sistema
  (function(){ var t=null; try{ t=localStorage.getItem("kadoo-tema"); }catch(e){}
    if(!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t); })();
</script>
<style>
/* =====================================================================
   TOKENS — espelho de design-system/tokens.css (Figma · Fundamentos)
   ===================================================================== */
:root{
  --kd-off-white:#F5F5ED; --kd-azul-claro:#CBE8FA; --kd-laranja:#FA4C03; --kd-vinho:#450102; --kd-escuro:#22161C; --kd-cobalto:#2F5BEA; --kd-noite:#12093E;
  --kd-laranja-200:#FFC2A0; --kd-laranja-300:#FFA06E; --kd-laranja-400:#FF7A3D; --kd-laranja-600:#C83A00; --kd-laranja-800:#9E2E00;
  --kd-ambar:#FFA31A; --kd-amarelo:#FFC21A;
  --kd-cobalto-300:#6F8FF5; --kd-cobalto-700:#2347C2; --kd-cobalto-800:#1C3A9E;
  --kd-neutro-100:#E2DFD4; --kd-neutro-300:#CBC5B6; --kd-neutro-500:#7A6E73; --kd-neutro-600:#6F6368;
  --kd-damasco:#FFF5EC; --kd-bege:#EDE5D6;

  --fundo-base:#F5F5ED; --fundo-superficie:#FFFFFF; --fundo-jornada:#FFF5EC; --fundo-suave:#F1E1DE;
  --texto-principal:#22161C; --texto-apoio:#5E5257; --texto-laranja:#C83A00; --texto-link:#2F5BEA;
  --borda-linha:#E2DFD4; --acao-primaria:#FA4C03; --progresso-barra:#2F5BEA;
  --no-concluida:#2F5BEA; --no-atual:#FA4C03; --no-bloqueada:#E2DFD4; --tecla-marcada:#2F5BEA; --recompensa-ponto:#FA4C03;
  /* derivados de componente */
  --no-bloqueada-lateral:#CBC5B6; --no-bloqueada-icone:#6F6368;
  --inativo:#7A6E73;
  --aro:inset 0 0 0 3px #FFFFFF;
  --flutuante:0 12px 32px rgba(34,22,28,.18);
  --sombra-leve:0 1px 2px rgba(34,22,28,.08);
  --aviso-fundo:#22161C; --aviso-texto:#F5F5ED;
  --trilho:rgba(34,22,28,.10);
  --acao-repouso:rgba(250,76,3,.5); --acao-repouso-texto:#22161C;

  --fonte:"Sora",system-ui,sans-serif;
  --raio-s:8px; --raio-m:12px; --raio-l:16px; --raio-xl:20px; --raio-2xl:24px;
  --gutter:20px;
  --mov-afundar:70ms; --mov-cor:160ms; --mov-press:240ms; --mov-soltar:220ms; --mov-tela:240ms; --mov-capa:520ms;
  --mola:cubic-bezier(.34,1.56,.64,1); --curva-tela:cubic-bezier(.23,1,.32,1);
  color-scheme:light;
}
[data-theme="dark"]{
  --fundo-base:#22161C; --fundo-superficie:#2E2127; --fundo-jornada:#362722; --fundo-suave:#3A1D20;
  --texto-principal:#F5F5ED; --texto-apoio:#C4B8BD; --texto-laranja:#FF7A3D; --texto-link:#CBE8FA;
  --borda-linha:#46363E; --progresso-barra:#6F8FF5; --no-bloqueada:#46363E;
  --no-bloqueada-lateral:#1A1015; --no-bloqueada-icone:#A89BA1;
  --inativo:#A89BA1;
  --aro:inset 0 0 0 3px rgba(245,245,237,.06);
  --flutuante:0 12px 32px rgba(0,0,0,.45);
  --sombra-leve:0 1px 2px rgba(0,0,0,.3);
  --aviso-fundo:#F5F5ED; --aviso-texto:#22161C;
  --trilho:rgba(245,245,237,.10);
  --acao-repouso:rgba(250,76,3,.5); --acao-repouso-texto:#F5F5ED;
  color-scheme:dark;
}

/* =====================================================================
   BASE + ESTILOS DE TEXTO
   ===================================================================== */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:88px;-webkit-text-size-adjust:100%}
body{font-family:var(--fonte);background:var(--fundo-base);color:var(--texto-principal);font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased;transition:background var(--mov-cor) ease-out,color var(--mov-cor) ease-out;min-height:100dvh}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
button,a,[role=button],label{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2.5px solid var(--texto-link);outline-offset:3px;border-radius:var(--raio-s)}
.t-display{font:600 28px/32px var(--fonte);letter-spacing:-1px}
.t-metrica{font:700 24px/28px var(--fonte);letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.t-titulo{font:600 20px/28px var(--fonte);letter-spacing:-.5px}
.t-titulo-s{font:600 18px/24px var(--fonte);letter-spacing:-.4px}
.t-corpo-l{font:400 16px/24px var(--fonte)}
.t-corpo{font:400 14px/20px var(--fonte)}
.t-corpo-forte{font:600 14px/20px var(--fonte)}
.t-rotulo{font:400 12px/16px var(--fonte)}
.t-legenda{font:400 11px/16px var(--fonte)}
.t-sobre{font:600 11px/16px var(--fonte);letter-spacing:1px;text-transform:uppercase}
.apoio{color:var(--texto-apoio)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:fixed;left:16px;top:-64px;z-index:300;background:var(--texto-principal);color:var(--fundo-base);padding:12px 16px;border-radius:var(--raio-m);font-weight:600;transition:top var(--mov-cor)}
.skip:focus{top:12px}
.ic{width:24px;height:24px;flex-shrink:0;display:block}
.ic.s16{width:16px;height:16px}.ic.s12{width:12px;height:12px}.ic.s20{width:20px;height:20px}.ic.s28{width:28px;height:28px}
.wm{display:inline-flex;align-items:baseline;gap:6px;white-space:nowrap}
.wm b{font-weight:600;font-size:22px;letter-spacing:-.04em;line-height:1}
.wm i{font-style:normal;font-weight:300;font-size:13px;color:var(--texto-laranja)}

/* =====================================================================
   SHELL — mobile first (390 ref.) · barra inferior; ≥1024 sidebar
   ===================================================================== */
.app{min-height:100dvh;display:flex}
.side{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column;padding-bottom:calc(89px + env(safe-area-inset-bottom))}
body.task .main{padding-bottom:0}
.hdr{position:sticky;top:0;z-index:40;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:8px;padding:16px var(--gutter) 8px;background:color-mix(in srgb,var(--fundo-base) 92%,transparent);backdrop-filter:blur(10px)}
.hdr .ttl{text-align:center;font:600 15px/24px var(--fonte);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .lead{grid-column:1/3;display:flex;align-items:center;min-height:48px}
.view{flex:1;width:100%;max-width:1280px;margin:0 auto;padding:8px var(--gutter) 32px;animation:telaIn var(--mov-tela) var(--curva-tela)}
@keyframes telaIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.view.back{animation-name:telaBack}
@keyframes telaBack{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.view.quiet{animation:none}

/* Barra de navegação (organismo) */
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:var(--fundo-base);border-top:1px solid var(--borda-linha);transition:transform var(--mov-tela) var(--curva-tela)}
body.task .navbar{transform:translateY(110%)}
.nav-it{width:80px;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:var(--raio-l);color:var(--inativo);font:400 11px/16px var(--fonte);transition:color var(--mov-cor)}
.nav-it[aria-current=page]{color:var(--texto-principal);font-weight:600}
.nav-it .ic{width:28px;height:28px;transition:color var(--mov-cor),transform var(--mov-afundar) ease-out}
.nav-it:hover .ic,.nav-it:focus-visible .ic{color:var(--hv)}
.nav-it:active .ic{transform:scale(.9)}

@media (min-width:1024px){
  .main{padding-bottom:0}
  .navbar{display:none}
  .side{display:flex;flex-direction:column;gap:24px;width:248px;flex-shrink:0;position:sticky;top:0;height:100dvh;padding:28px 16px 20px;border-right:1px solid var(--borda-linha)}
  .side .wm{padding:0 12px}
  .side nav{display:flex;flex-direction:column;gap:4px}
  .side .nav-it{width:auto;flex-direction:row;justify-content:flex-start;gap:12px;padding:0 12px;font-size:14px;line-height:20px}
  .side .nav-it .ic{width:24px;height:24px}
  .side .nav-it[aria-current=page]{background:var(--fundo-superficie);box-shadow:var(--sombra-leve)}
  .side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
  .hdr .lead .wm{display:none}
  .view{padding:8px 40px 48px}
  .hdr{padding:20px 40px 8px}
}
@media (max-width:360px){:root{--gutter:16px}}

/* =====================================================================
   ÁTOMOS
   ===================================================================== */
/* Botão principal: laranja 50% em repouso → 100% em toque/foco/hover; altura 56, raio 16 */
.btn{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:56px;padding:0 16px 0 20px;border-radius:var(--raio-l);font:600 15px/24px var(--fonte);text-align:left;transition:background var(--mov-cor) ease-out,color var(--mov-cor) ease-out,transform var(--mov-afundar) ease-out}
.btn-pri{background:var(--acao-repouso);color:var(--acao-repouso-texto)}
.btn-pri:hover,.btn-pri:focus-visible,.btn-pri:active{background:var(--acao-primaria);color:#22161C}
.btn:active{transform:scale(.985)}
.btn-pri[aria-disabled=true]{background:color-mix(in srgb,var(--texto-principal) 8%,transparent);color:var(--texto-apoio);cursor:not-allowed}
.btn-pri[aria-busy=true]{cursor:progress}
.btn-sec{min-height:48px;justify-content:center;border:1.5px solid var(--borda-linha);font-size:14px;line-height:20px;padding:0 16px}
.btn-sec:hover{border-color:var(--texto-apoio)}
.btn.auto{width:auto}
.link{color:var(--texto-link);text-decoration:underline;text-underline-offset:3px;font-weight:600;min-height:44px;display:inline-flex;align-items:center}
.icon-btn{width:48px;height:48px;border-radius:999px;display:grid;place-items:center;background:var(--fundo-superficie);box-shadow:var(--sombra-leve);transition:transform var(--mov-afundar) ease-out,color var(--mov-cor)}
.icon-btn:hover{color:var(--kd-laranja)}
.icon-btn:active{transform:scale(.92)}
.hint{color:var(--texto-laranja);font:400 12px/16px var(--fonte);text-align:center;margin-bottom:8px}

/* Selo (status): texto + cor, nunca só cor · altura 24, raio total, 11px */
.selo{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:999px;font:600 11px/16px var(--fonte);white-space:nowrap;border:1px solid var(--borda-linha)}
.selo .ic{width:12px;height:12px}
.selo.disp{border-color:rgba(250,76,3,.45);color:var(--texto-laranja)}
.selo.ok{background:var(--kd-cobalto);border-color:var(--kd-cobalto);color:#F5F5ED}
.selo.aguarda{border-color:var(--kd-cobalto)}
.selo.opc{color:var(--texto-apoio)}
.selo.vivo{border-color:rgba(250,76,3,.45);color:var(--texto-laranja)}
.selo.vivo::before{content:"";width:6px;height:6px;border-radius:9px;background:var(--kd-laranja);animation:pulso 1.4s infinite}
@keyframes pulso{50%{opacity:.3}}

/* Chip de sequência, avatar */
.chip-seq{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 12px 0 8px;border-radius:999px;background:var(--fundo-suave);color:var(--kd-vinho);font:400 12px/16px var(--fonte)}
[data-theme=dark] .chip-seq{color:#F1E1DE}
.avatar{width:40px;height:40px;border-radius:999px;background:var(--kd-cobalto);color:#F5F5ED;display:grid;place-items:center;font:700 12px/16px var(--fonte);flex-shrink:0}
.avatar.l{width:56px;height:56px;font-size:16px}

/* Nó da trilha (botão 3D): face + lateral sólida 6px + brilho interno no topo */
.node{--face:var(--no-concluida);--side:var(--kd-cobalto-800);--ink:#F5F5ED;position:relative;width:64px;height:58px;border-radius:999px;display:grid;place-items:center;color:var(--ink);background:var(--face);box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 6px 0 var(--side);transform:translate(var(--x,0),0);transition:transform var(--mov-soltar) var(--mola),box-shadow var(--mov-soltar) var(--mola),background var(--mov-cor)}
.node.cur{--face:var(--no-atual);--side:var(--kd-laranja-800);--ink:#22161C}
.node.lock{--face:var(--no-bloqueada);--side:var(--no-bloqueada-lateral);--ink:var(--no-bloqueada-icone)}
.node:active{transform:translate(var(--x,0),4px);box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 2px 0 var(--side);transition-duration:var(--mov-afundar);transition-timing-function:ease-out}
.node[aria-expanded=true]{transform:translate(var(--x,0),4px);box-shadow:inset 0 2px 0 rgba(0,0,0,.12),0 2px 0 var(--side);transition:transform var(--mov-press) ease-out,box-shadow var(--mov-press) ease-out}
.node.done[aria-expanded=true]{--face:var(--kd-cobalto-700)}
.node.cur[aria-expanded=true]{--face:var(--kd-laranja-600);--ink:#F5F5ED}
.node.flash{animation:nodeFlash 1.2s ease-out}
@keyframes nodeFlash{0%{box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 6px 0 var(--side),0 0 0 0 rgba(250,76,3,.6)}100%{box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 6px 0 var(--side),0 0 0 22px rgba(250,76,3,0)}}

/* Tecla 3D (resposta) */
.tecla{position:relative;min-width:44px;min-height:48px;border-radius:var(--raio-m);display:grid;place-items:center;background:var(--fundo-superficie);border:1.5px solid var(--borda-linha);box-shadow:0 4px 0 var(--borda-linha);font:600 15px/24px var(--fonte);cursor:pointer;transition:transform var(--mov-soltar) var(--mola),box-shadow var(--mov-soltar) var(--mola),background var(--mov-cor)}
.tecla input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.tecla:active{transform:translateY(4px);box-shadow:0 0 0 var(--borda-linha);transition-duration:var(--mov-afundar)}
.tecla:has(input:checked){background:var(--tecla-marcada);border-color:var(--kd-cobalto-800);color:#F5F5ED;box-shadow:0 2px 0 var(--kd-cobalto-800);transform:translateY(2px);transition:transform var(--mov-press) ease-out,box-shadow var(--mov-press) ease-out,background var(--mov-press)}
.tecla:has(input:focus-visible){outline:2.5px solid var(--texto-link);outline-offset:3px}

/* Ponto (raio) e estrela */
.pontos{display:inline-flex;gap:2px;align-items:center}
.ponto{width:16px;height:16px;color:var(--recompensa-ponto)}
.ponto.off{color:var(--inativo);opacity:.7}
.estrelas{display:flex;gap:0}
.estrela{width:56px;height:56px;display:grid;place-items:center;color:var(--inativo);transition:transform var(--mov-soltar) var(--mola),color var(--mov-cor)}
.estrela .ic{width:36px;height:36px}
.estrela[aria-checked=true]{color:var(--kd-laranja)}
.estrela.aperta{animation:aperta var(--mov-press) ease-out both}
@keyframes aperta{40%{transform:scale(.82)}100%{transform:scale(1)}}

/* Barra de progresso: trilho 12px · rampa quente · sempre com número */
.barra{height:12px;border-radius:999px;background:var(--trilho);overflow:hidden}
.barra i{display:block;height:100%;width:100%;border-radius:999px;background:linear-gradient(90deg,#FA4C03,#FF7A3D 40%,#FFA31A 75%,#FFC21A);transform-origin:left;transform:scaleX(var(--p,0));transition:transform .7s var(--curva-tela)}
.barra.fina{height:4px}
.barra.fina i{background:var(--progresso-barra)}
.prog-top{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px}
.prog-top b{font-weight:600;font-variant-numeric:tabular-nums}

/* Campos */
.campo label{display:block;font:600 12px/16px var(--fonte);margin-bottom:8px}
.caixa{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 12px;border-radius:var(--raio-l);border:2px solid var(--borda-linha);background:var(--fundo-superficie);transition:border-color var(--mov-cor)}
.caixa:focus-within{border-color:var(--kd-cobalto)}
.caixa input{flex:1;min-width:0;border:0;background:none;outline:none;height:44px;font:400 14px/20px var(--fonte)}
.caixa input::placeholder{color:var(--texto-apoio)}
textarea.area{width:100%;min-height:104px;resize:vertical;padding:12px 14px;border-radius:var(--raio-l);border:2px solid var(--borda-linha);background:var(--fundo-superficie);outline:none;font:400 14px/20px var(--fonte);transition:border-color var(--mov-cor)}
textarea.area:focus{border-color:var(--kd-cobalto)}
.contador{text-align:right;margin-top:4px}

/* Interruptor 52×32 */
.switch{position:relative;width:52px;height:32px;flex-shrink:0}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--borda-linha);transition:background var(--mov-cor)}
.switch span::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:999px;background:#fff;box-shadow:var(--sombra-leve);transition:transform var(--mov-soltar) var(--mola)}
.switch input:checked+span{background:var(--kd-cobalto)}
.switch input:checked+span::after{transform:translateX(20px)}
.switch input:focus-visible+span{outline:2.5px solid var(--texto-link);outline-offset:3px}

/* Abas (segmentado) */
.abas{display:flex;gap:4px;padding:4px;border-radius:999px;background:color-mix(in srgb,var(--texto-principal) 6%,transparent)}
.aba{flex:1;min-height:40px;border-radius:999px;font:600 12px/16px var(--fonte);color:var(--texto-apoio);transition:background var(--mov-cor),color var(--mov-cor);white-space:nowrap;padding:0 12px}
.aba[aria-pressed=true]{background:var(--fundo-superficie);color:var(--texto-principal);box-shadow:var(--sombra-leve)}

/* Chip de filtro */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px;margin:0 -2px}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:0 14px;border-radius:999px;border:1.5px solid var(--borda-linha);font:600 12px/16px var(--fonte);white-space:nowrap;transition:background var(--mov-cor),color var(--mov-cor),border-color var(--mov-cor)}
.chip[aria-pressed=true]{background:var(--texto-principal);border-color:var(--texto-principal);color:var(--fundo-base)}
.chip .ic{width:12px;height:12px}

/* Busca em pílula + botão de filtros */
.busca{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 4px 0 16px;border-radius:999px;background:var(--fundo-superficie);border:1.5px solid var(--borda-linha)}
.busca:focus-within{border-color:var(--kd-cobalto)}
.busca input{flex:1;min-width:0;border:0;background:none;outline:none;height:44px}
.busca input::placeholder{color:var(--texto-apoio)}
.busca .fbtn{width:40px;height:40px;border-radius:999px;display:grid;place-items:center;background:var(--fundo-base)}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:var(--raio-s);border:1px solid var(--borda-linha);font:400 11px/16px var(--fonte);color:var(--texto-apoio)}

/* =====================================================================
   MOLÉCULAS / ORGANISMOS
   ===================================================================== */
.card{background:var(--fundo-superficie);border:1px solid var(--borda-linha);border-radius:var(--raio-xl)}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:32px 0 12px}
.sec-h h2{font:600 18px/24px var(--fonte);letter-spacing:-.4px}
.sec-h a,.sec-h button.lk{color:var(--texto-link);font:600 12px/16px var(--fonte);min-height:44px;display:inline-flex;align-items:center}

/* Card da jornada (Home) */
.jornada{background:var(--fundo-jornada);box-shadow:var(--aro);border-radius:var(--raio-2xl);padding:20px;display:flex;flex-direction:column;gap:16px}
.jornada .sobre{display:flex;align-items:center;gap:6px}

/* Card de KPI */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{border-radius:var(--raio-l);padding:12px;min-height:126px;display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid rgba(34,22,28,.18);transition:transform var(--mov-afundar) ease-out}
.kpi:active{transform:scale(.97)}
.kpi .t-metrica{margin-top:auto}
.kpi.bege{background:var(--kd-bege);color:#22161C}
.kpi.cob{background:var(--kd-cobalto);color:#F5F5ED;border-color:rgba(245,245,237,.18)}
.kpi.lar{background:var(--kd-laranja);color:#22161C}

/* Item de edital (lista) */
.item-ed{display:flex;gap:12px;align-items:center;padding:8px 0;min-height:88px;border-radius:var(--raio-l);transition:background var(--mov-cor)}
.item-ed:hover{background:color-mix(in srgb,var(--texto-principal) 4%,transparent)}
.thumb{width:72px;height:72px;border-radius:var(--raio-l);flex-shrink:0;display:grid;place-items:center;background:linear-gradient(160deg,var(--kd-cobalto),var(--kd-noite));color:var(--kd-azul-claro)}
.thumb .ic{width:36px;height:36px}
.item-ed .st{display:flex;align-items:center;gap:6px}
.item-ed .st::before{content:"";width:6px;height:6px;border-radius:9px;background:var(--dot,var(--kd-cobalto))}

/* Card de edital */
.eds{display:grid;gap:16px}
.ed{overflow:hidden;display:flex;flex-direction:column;text-align:left;transition:transform var(--mov-afundar) ease-out,box-shadow var(--mov-cor)}
.ed:hover{box-shadow:var(--flutuante)}
.ed:active{transform:scale(.985)}
.capa-ed{position:relative;aspect-ratio:4/3;background:var(--kd-noite);overflow:hidden}
.capa-ed img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s var(--curva-tela)}
.ed:hover .capa-ed img{transform:scale(1.04)}
.capa-ed svg{position:absolute;inset:0;width:100%;height:100%}
.capa-ed .selo{position:absolute;left:12px;top:12px;background:var(--fundo-superficie);color:var(--texto-laranja);border-color:transparent;z-index:1}
.capa-ed .selo.vivo{color:var(--texto-laranja)}

/* =====================================================================
   BANNER (design anterior) · regra 60-30-10
   60% fundo noite→cobalto · 30% letras em azuis · 10% acento laranja (1 letra)
   ===================================================================== */
.hero{--bg:#0E053A;--ink:#fff;--ink2:#CBE8FA;--line:rgba(203,232,250,.4);--track:rgba(203,232,250,.25);--sol-bg:#CBE8FA;--sol-ink:#12093E;position:relative;border-radius:var(--raio-2xl);background:var(--bg);color:var(--ink2);transition:background .6s ease;overflow:hidden;display:grid;grid-template-columns:1.05fr 1fr;min-height:320px;aspect-ratio:2400/838;margin:8px 0 16px;isolation:isolate}
.hero[data-tone=dark]{--ink:#22161C;--ink2:#22161C;--line:rgba(34,22,28,.4);--track:rgba(34,22,28,.2);--sol-bg:#22161C;--sol-ink:#F5F5ED}
.hero-imgs{position:absolute;inset:0;z-index:0;transition:transform .6s var(--curva-tela);animation:capaIn var(--mov-capa) var(--curva-tela) both}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:right center;opacity:0;transition:opacity .6s ease}
.hero-img.on{opacity:1}
.hero-copy{padding:36px 36px 28px;display:flex;flex-direction:column;gap:14px;z-index:2}
.hero .eyebrow{opacity:.75}
.hero #hH{font:300 clamp(34px,4.2vw,52px)/1.02 var(--fonte);letter-spacing:-.03em;color:var(--ink);transition:color .6s ease;min-height:2.04em}
.hero #hH em{font-style:normal;font-weight:600;color:var(--ink2)}
.hero p{font:400 15px/24px var(--fonte);max-width:420px;opacity:.85;min-height:48px}
.hero .swap{transition:opacity var(--mov-cor) ease-out,transform var(--mov-cor) ease-out}
.hero-copy.fading .swap{opacity:0;transform:translateY(6px);transition-timing-function:ease-in}
.hero-cta{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.btn-hero{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 18px;border-radius:var(--raio-l);border:1.5px solid var(--line);color:var(--ink2);font:600 14px/20px var(--fonte);transition:background var(--mov-cor),border-color var(--mov-cor),transform var(--mov-afundar) ease-out}
.btn-hero:hover,.btn-hero:focus-visible{background:color-mix(in srgb,var(--ink2) 10%,transparent);border-color:var(--ink2)}
.btn-hero:active{transform:scale(.97)}
.btn-hero.sol{background:var(--sol-bg);color:var(--sol-ink);border-color:var(--sol-bg)}
.btn-hero.sol:hover{background:var(--sol-bg);filter:brightness(1.12)}
.hero :focus-visible{outline-color:var(--ink2)}
.dots{display:flex;gap:2px;align-items:center}
.dot{width:34px;height:24px;position:relative;border-radius:8px}
.dot::before,.dot.on::after{content:"";position:absolute;left:4px;right:4px;top:9px;height:6px;border-radius:99px;background:var(--track)}
.dot.on::after{background:var(--ink2);transform-origin:left;animation:fillDot 5s linear forwards}
@keyframes fillDot{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.hero.paused .dot.on::after{animation-play-state:paused}
.pause{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink2);border:1px solid var(--line);margin-left:8px}
.pause:hover{background:color-mix(in srgb,var(--ink2) 10%,transparent)}
.pause .ic{width:16px;height:16px}
.hero-stage{position:relative;min-height:320px}
.hl{position:absolute;padding:0;border-radius:28px;cursor:pointer;transition:transform .6s var(--curva-tela),filter var(--mov-cor)}
.hl svg{width:100%;height:100%;display:block;overflow:visible}
.hl use{transition:fill .6s var(--curva-tela),stroke .6s var(--curva-tela)}
.hl:hover{filter:brightness(1.08)}
.hl:active{scale:.96}
.hl.bounce{animation:bounce .6s var(--mola)}
@keyframes bounce{0%{scale:1}35%{scale:1.12 .9}65%{scale:.95 1.06}100%{scale:1}}
.hero-hint{position:absolute;right:20px;bottom:14px;font:600 11px/16px var(--fonte);letter-spacing:.06em;opacity:.6;z-index:3}
@media (max-width:719px){
  .hero{grid-template-columns:1fr;margin-top:4px}
  .hero{aspect-ratio:auto}
  .hero-imgs{position:relative;order:-1;aspect-ratio:1.35}
  .hero-hint{display:none}
  .hero-copy{padding:4px 20px 24px}
  .hero #hH{min-height:0}
}
.ed-body{padding:16px;display:flex;flex-direction:column;gap:8px}
.meta{display:flex;align-items:center;gap:6px;color:var(--texto-apoio);font:400 12px/16px var(--fonte)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}

/* Card de mentor */
.mentor{padding:16px;display:flex;gap:12px;align-items:flex-start}
.mentor .tags{margin-top:8px}

/* Banner do programa */
.banner{position:relative;border-radius:var(--raio-2xl);padding:20px;min-height:192px;background:linear-gradient(160deg,var(--kd-cobalto),var(--kd-noite));box-shadow:var(--aro);color:#fff;overflow:hidden;display:flex;flex-direction:column;gap:8px}
.banner .big{position:absolute;right:-8px;bottom:-12px;width:139px;height:139px;color:var(--kd-azul-claro);opacity:.9}
.banner .tagb{align-self:flex-start;height:24px;display:inline-flex;align-items:center;padding:0 9px;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);font:400 11px/16px var(--fonte)}
.banner h1{font:700 24px/28px var(--fonte);letter-spacing:-.5px;max-width:250px;margin-top:auto}
.banner p{font:400 12px/16px var(--fonte);opacity:.85;max-width:260px}
.banner .info{position:absolute;right:16px;top:16px;width:40px;height:40px;border-radius:999px;display:grid;place-items:center;background:rgba(18,9,62,.35);border:1px solid rgba(255,255,255,.4);color:#fff}

/* Par de indicadores */
.pares{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ind{display:flex;align-items:center;gap:12px;padding:16px;border-radius:var(--raio-xl);background:var(--fundo-superficie);border:1px solid var(--borda-linha);min-height:80px}
.medidor{width:48px;height:48px;position:relative;flex-shrink:0}
.medidor svg{width:100%;height:100%;transform:rotate(-90deg)}
.medidor b{position:absolute;inset:0;display:grid;place-items:center;font:700 12px/16px var(--fonte);font-variant-numeric:tabular-nums}
.medidor circle{transition:stroke-dashoffset .8s var(--curva-tela)}

/* Divisor de parte */
/* Cabeçalho de parte (tema encadeado da trilha) */
.parte-sec{margin-top:32px}
.parte{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 16px 16px 16px;border-radius:var(--raio-xl);background:var(--fundo-superficie);border:1px solid var(--borda-linha);margin-bottom:20px}
.parte-num{width:52px;height:52px;border-radius:var(--raio-l);display:grid;place-items:center;font:700 20px/1 var(--fonte);font-variant-numeric:tabular-nums;flex-shrink:0}
.parte-tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.parte-tt{font:600 20px/28px var(--fonte);letter-spacing:-.5px}
.parte-sub{color:var(--texto-apoio)}
.parte-prog{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;color:var(--texto-apoio)}
.parte-badge{width:64px;height:64px;flex-shrink:0}
.parte-badge svg{width:100%;height:100%}
.parte-badge .faixa{display:none}
/* concluída: superfície + número cobalto com check */
.parte.done .parte-num{background:var(--kd-cobalto);color:#F5F5ED;box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 4px 0 var(--kd-cobalto-800)}
.parte.done .parte-ey{color:var(--texto-link)}
/* em andamento: cobalto (30) com lateral 3D, texto claro, raios laranja (10) */
.parte.cur{background:var(--kd-cobalto);border-color:var(--kd-cobalto);color:#F5F5ED;box-shadow:0 6px 0 var(--kd-cobalto-800)}
.parte.cur .parte-num{background:#F5F5ED;color:#1C3A9E;box-shadow:0 4px 0 rgba(18,9,62,.35)}
.parte.cur .parte-sub,.parte.cur .parte-prog{color:#F5F5ED;opacity:.85}
.parte.cur .parte-ey{color:#CBE8FA}
.parte.cur .ponto.off{color:#F5F5ED;opacity:.45}
.parte.cur .parte-badge{opacity:.55}
/* bloqueada: contorno tracejado, conteúdo suave, cadeado garante a leitura */
.parte.lock{background:transparent;border:2px dashed var(--borda-linha)}
.parte.lock .parte-num{background:var(--no-bloqueada);color:var(--no-bloqueada-icone)}
.parte.lock .parte-tt{color:var(--texto-apoio)}
.parte.lock .parte-badge{opacity:.7}
@media (max-width:480px){
  .parte{grid-template-columns:auto minmax(0,1fr);gap:12px;padding:14px}
  .parte-num{width:44px;height:44px;font-size:17px}
  .parte-badge{display:none}
  .parte-tt{font-size:18px;line-height:24px}
}
.divisor{display:flex;align-items:center;gap:10px;margin:28px 0 20px}
.divisor::before,.divisor::after{content:"";flex:1;border-top:2px dashed var(--borda-linha)}
.divisor .t-rotulo{white-space:nowrap;color:var(--texto-apoio)}
.row.aqui{padding-top:40px}

/* Trilha */
.trilha{display:flex;flex-direction:column;align-items:center}
.row{position:relative;display:flex;flex-direction:column;align-items:center;padding:10px 0 14px}
.balao{position:absolute;top:4px;left:50%;transform:translateX(calc(-50% + var(--x,0px)));background:var(--texto-principal);color:var(--fundo-base);font:600 11px/16px var(--fonte);padding:4px 10px;border-radius:var(--raio-s);white-space:nowrap;animation:flutua 2.4s ease-in-out infinite}
.balao::after{content:"";position:absolute;left:50%;bottom:-4px;width:8px;height:8px;background:inherit;transform:translateX(-50%) rotate(45deg);border-radius:1px}
@keyframes flutua{50%{translate:0 -3px}}
.badge-row{display:flex;justify-content:center;margin:4px 0 0}

/* Cartão da etapa (popover da trilha) */
.pop{position:relative;width:min(342px,100%);margin:14px auto 4px;padding:16px;border-radius:var(--raio-xl);background:var(--fundo-superficie);border:1px solid rgba(250,76,3,.45);box-shadow:var(--flutuante);display:flex;flex-direction:column;gap:6px;animation:popIn var(--mov-tela) var(--curva-tela)}
.pop.done{border-color:color-mix(in srgb,var(--kd-cobalto) 45%,transparent)}
.pop.lock{border-color:var(--borda-linha)}
.pop::before{content:"";position:absolute;top:-8px;left:calc(50% + var(--x,0px));width:14px;height:14px;background:inherit;border-left:inherit;border-top:inherit;transform:translateX(-50%) rotate(45deg);border-radius:3px 0 0 0}
.pop .btn{margin-top:8px}
@keyframes popIn{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
.pop-tipo{display:flex;align-items:center;gap:6px;color:var(--texto-apoio)}

/* Badge da parte */
.badge{width:120px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.badge svg{width:120px;height:120px}

/* Linha de arquivo + área de envio */
.envio{width:100%;border:2px dashed color-mix(in srgb,var(--kd-cobalto) 55%,transparent);background:color-mix(in srgb,var(--kd-cobalto) 6%,transparent);border-radius:var(--raio-xl);min-height:132px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:20px;text-align:center;transition:background var(--mov-cor)}
.envio:hover{background:color-mix(in srgb,var(--kd-cobalto) 10%,transparent)}
.envio .q{width:48px;height:48px;border-radius:var(--raio-m);display:grid;place-items:center;background:var(--kd-cobalto);color:#F5F5ED}
.arquivo{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--raio-l);background:var(--fundo-superficie);border:1px solid var(--borda-linha)}
.arquivo .q{width:40px;height:40px;border-radius:var(--raio-m);display:grid;place-items:center;background:color-mix(in srgb,var(--kd-laranja) 14%,transparent);color:var(--texto-laranja);flex-shrink:0}
.arquivo .nm{font:600 14px/20px var(--fonte);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Linha do tempo */
.tempo{display:flex;flex-direction:column}
.t-item{display:grid;grid-template-columns:24px 1fr;gap:12px;min-height:60px}
.t-mark{display:flex;flex-direction:column;align-items:center}
.t-dot{width:24px;height:24px;border-radius:999px;border:2px solid var(--borda-linha);background:var(--fundo-superficie);display:grid;place-items:center;flex-shrink:0}
.t-line{flex:1;width:2px;border-radius:2px;background:var(--borda-linha);margin:2px 0}
.t-item:last-child .t-line{display:none}
.t-item.feito .t-dot{background:var(--kd-cobalto);border-color:var(--kd-cobalto);color:#F5F5ED}
.t-item.feito .t-line{background:var(--kd-cobalto)}
.t-item.agora .t-dot{border-color:var(--kd-laranja)}
.t-item.agora .t-dot::after{content:"";width:8px;height:8px;border-radius:9px;background:var(--kd-laranja);animation:pulso 1.2s infinite}
.t-item.prox b{color:var(--texto-apoio)}

/* Card de evento */
.evento{display:flex;gap:12px;align-items:center;padding:12px;border-radius:var(--raio-xl);background:var(--fundo-superficie);border:1px solid var(--borda-linha)}
.evento.vivo{border-color:rgba(250,76,3,.45)}
.data{width:52px;min-height:56px;border-radius:var(--raio-m);border:1.5px solid var(--borda-linha);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.data b{font:700 20px/24px var(--fonte);font-variant-numeric:tabular-nums}
.data small{font:600 10px/12px var(--fonte);text-transform:uppercase;letter-spacing:.5px;color:var(--texto-apoio)}

/* Capa da etapa (cena) */
.capa{position:relative;height:220px;border-radius:var(--raio-2xl);overflow:hidden;background:radial-gradient(60% 40% at 80% 85%,rgba(255,255,255,.55),transparent 70%),radial-gradient(50% 35% at 15% 95%,rgba(255,255,255,.45),transparent 70%),linear-gradient(180deg,#2F5BEA,#6F8FF5 60%,#CBE8FA);margin-bottom:44px;overflow:visible}
.capa .clip{position:absolute;inset:0;border-radius:var(--raio-2xl);overflow:hidden}
.capa .palavra{position:absolute;left:16px;right:16px;top:14px;font:700 64px/.86 var(--fonte);letter-spacing:-3px;color:#fff;opacity:.88;text-transform:uppercase;animation:capaIn var(--mov-capa) var(--curva-tela) both}
.capa .fig{position:absolute;right:20px;bottom:-6px;width:150px;height:150px;color:#F5F5ED;opacity:.95;animation:capaIn var(--mov-capa) var(--curva-tela) .08s both}
.capa .selo-capa{position:absolute;right:12px;top:12px;height:32px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.88);color:#22161C;font:600 12px/16px var(--fonte)}
.capa .node{position:absolute;left:20px;bottom:-30px;pointer-events:none}
@keyframes capaIn{from{opacity:0;transform:translateY(16px)}to{transform:none}}

/* Dica (balão), alerta */
.dica{background:color-mix(in srgb,var(--fundo-superficie) 94%,transparent);border-radius:var(--raio-l);padding:12px;border:1px solid var(--borda-linha)}
.dica .t-sobre{color:var(--texto-link)}
.alerta{display:flex;gap:10px;padding:12px;border-radius:var(--raio-m);background:var(--fundo-suave);color:var(--kd-vinho)}
[data-theme=dark] .alerta{color:#F1E1DE}

/* Cartão de avaliação (rubrica) */
.rubrica{padding:16px;display:flex;flex-direction:column;gap:14px}
.crit .prog-top{margin-bottom:6px}

/* Dock da ação (modo tarefa) */
.dock{position:sticky;bottom:0;z-index:30;margin:0 calc(var(--gutter) * -1);padding:12px var(--gutter) calc(12px + env(safe-area-inset-bottom));background:var(--fundo-base);border-top:1px solid var(--borda-linha)}
@media (min-width:1024px){.dock{margin:0 -40px;padding:16px 40px}}
.tarefa{max-width:560px;margin:0 auto}

/* Item de lista (configurações) */
.lista{padding:4px 16px}
.li{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 0;width:100%;text-align:left;border-bottom:1px solid var(--borda-linha)}
.li:last-child{border-bottom:0}
.li .q{width:40px;height:40px;border-radius:var(--raio-m);display:grid;place-items:center;background:var(--fundo-base);flex-shrink:0}
.li .tx{flex:1;min-width:0}
.li.perigo{color:var(--kd-vinho)}
[data-theme=dark] .li.perigo{color:#FFA06E}
.li.perigo .q{background:var(--fundo-suave)}

/* Calendário de sequência */
.semana{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.dia{display:flex;flex-direction:column;align-items:center;gap:6px}
.dia i{width:36px;height:36px;border-radius:999px;display:grid;place-items:center;background:var(--fundo-base);font-style:normal}
.dia.hoje i{box-shadow:inset 0 0 0 2px var(--kd-laranja)}
.dia.fogo i{background:var(--fundo-suave)}

/* Cabeçalho de perfil */
.perfil-h{padding:24px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.perfil-h .avatar{width:80px;height:80px;font-size:24px;box-shadow:0 0 0 4px var(--fundo-superficie),0 0 0 7px var(--kd-cobalto);margin-bottom:8px}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;margin-top:12px}
.nums div{background:var(--fundo-base);border-radius:var(--raio-l);padding:12px 4px}
.galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;padding:16px;justify-items:center}

/* Estado vazio */
.vazio{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:40px 20px}
.vazio .q{width:64px;height:64px;border-radius:999px;display:grid;place-items:center;background:var(--fundo-superficie);border:1px solid var(--borda-linha);margin-bottom:8px}

/* Esqueleto */
.sk{background:linear-gradient(90deg,var(--borda-linha),color-mix(in srgb,var(--borda-linha) 40%,transparent),var(--borda-linha));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:var(--raio-m)}
@keyframes sk{to{background-position:-200% 0}}

/* Folha inferior / diálogo */
.scrim{position:fixed;inset:0;z-index:90;background:rgba(18,9,14,.45);opacity:0;pointer-events:none;transition:opacity var(--mov-cor) ease-in}
.scrim.on{opacity:1;pointer-events:auto;transition-timing-function:ease-out}
.folha{position:fixed;left:0;right:0;bottom:0;z-index:100;background:var(--fundo-superficie);border-radius:var(--raio-2xl) var(--raio-2xl) 0 0;padding:12px 20px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;transform:translateY(105%);transition:transform 160ms ease-in;max-height:88dvh;overflow:auto}
.folha.on{transform:none;transition:transform var(--mov-tela) var(--curva-tela)}
.folha .alca{width:40px;height:4px;border-radius:9px;background:var(--borda-linha);margin:0 auto 8px}
@media (min-width:1024px){
  .folha{left:50%;right:auto;bottom:auto;top:50%;width:440px;border-radius:var(--raio-2xl);transform:translate(-50%,-46%);opacity:0;pointer-events:none;transition:transform 160ms ease-in,opacity 160ms ease-in}
  .folha.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
  .folha .alca{display:none}
}

/* Aviso flutuante (toast) */
.avisos{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;width:min(400px,calc(100% - 32px));pointer-events:none}
.aviso{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 14px;border-radius:var(--raio-l);background:var(--aviso-fundo);color:var(--aviso-texto);box-shadow:var(--flutuante);animation:avisoIn var(--mov-tela) var(--curva-tela)}
.aviso .tx{flex:1;min-width:0}
.aviso button{min-height:36px;padding:0 12px;border-radius:var(--raio-m);font:600 12px/16px var(--fonte);background:color-mix(in srgb,var(--aviso-texto) 14%,transparent)}
.aviso.out{animation:avisoOut 160ms ease-in forwards}
@keyframes avisoIn{from{opacity:0;transform:translateY(-12px)}}
@keyframes avisoOut{to{opacity:0;transform:translateY(-12px)}}

/* Recompensa (diálogo modal) */
.rw{position:fixed;inset:0;z-index:150;display:none;place-items:center;padding:24px;background:rgba(18,9,14,.6)}
.rw.on{display:grid}
.rw-card{width:min(360px,100%);border-radius:var(--raio-2xl);background:var(--fundo-superficie);padding:28px 20px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;animation:popIn var(--mov-tela) var(--curva-tela)}
.rw-stage{position:relative;width:160px;height:160px;margin-bottom:8px}
.rw-stage svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.rw .anel{position:absolute;inset:20px;border-radius:999px;border:2px solid var(--kd-laranja-300);opacity:0}
.rw-mais{position:absolute;right:6px;top:10px;padding:4px 10px;border-radius:999px;background:var(--texto-principal);color:var(--fundo-base);font:700 14px/20px var(--fonte);opacity:0}
.rw-fileira{display:flex;gap:4px;justify-content:center;margin:4px 0 8px}
.rw-fileira .ponto{width:20px;height:20px}
/* sequência +1 ponto (~1,4s) */
.rw.play .dot{animation:rwDot 380ms var(--mola) both}
.rw.play .seal{animation:rwSeal 620ms var(--curva-tela) 380ms both}
.rw.play .anel{animation:rwAnel 700ms ease-out 420ms both}
.rw.play .anel.b{animation-delay:560ms}
.rw.play .bolt{animation:rwBolt 260ms ease-out 1000ms both}
.rw.play .bolt path{stroke-dasharray:80;animation:rwDraw 200ms ease-out 1000ms both}
.rw.play .flash{animation:rwFlash 420ms ease-out 1200ms both}
.rw.play .shake{animation:rwShake 300ms ease-out 1200ms}
.rw.play .rw-mais{animation:rwMais 360ms var(--mola) 1400ms both}
.rw.play .novo{animation:rwMais 360ms var(--mola) 1500ms both}
@keyframes rwDot{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes rwSeal{from{opacity:0;transform:scale(.6) rotate(-30deg)}to{opacity:1;transform:scale(1) rotate(0)}}
@keyframes rwAnel{0%{opacity:.8;transform:scale(.8)}100%{opacity:0;transform:scale(1.35)}}
@keyframes rwBolt{from{opacity:0;transform:translateY(-40px)}to{opacity:1;transform:none}}
@keyframes rwDraw{from{stroke-dashoffset:80}to{stroke-dashoffset:0}}
@keyframes rwFlash{0%{opacity:0;transform:scale(.6)}40%{opacity:1}100%{opacity:0;transform:scale(1.5)}}
@keyframes rwShake{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
@keyframes rwMais{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.dot,.seal,.bolt,.flash,.shake{transform-origin:80px 80px;transform-box:view-box}
/* badge da parte */
.rw-badge{width:min(380px,100%);border-radius:var(--raio-2xl);overflow:hidden;background:var(--kd-noite);color:#F5F5ED;text-align:left;animation:popIn var(--mov-tela) var(--curva-tela)}
.rw-badge .cena{position:relative;height:240px;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 50%,#2F5BEA,#12093E 70%)}
.rw-badge .raios{position:absolute;inset:-50%;background:repeating-conic-gradient(rgba(255,255,255,.10) 0 8deg,transparent 8deg 22deg);animation:gira 14s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.rw-badge .hex{position:relative;width:170px;height:170px;animation:rwSeal 640ms var(--curva-tela) both}
.rw-badge .hex .estr{transform-origin:72px 55px;transform-box:view-box;animation:estrIn 600ms var(--mola) 400ms both}
@keyframes estrIn{from{opacity:0;transform:rotate(-180deg) scale(.3)}to{opacity:1;transform:none}}
.rw-badge .faixa{transform-origin:72px 122px;transform-box:view-box;animation:faixa 420ms var(--curva-tela) 800ms both}
@keyframes faixa{from{transform:scaleX(0)}to{transform:none}}
.rw-badge .brilho{position:absolute;width:10px;height:10px;color:var(--kd-amarelo);animation:brilha 1.6s ease-in-out infinite}
@keyframes brilha{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
.rw-badge .tx{padding:20px;display:flex;flex-direction:column;gap:6px}
.rw-badge .btn-sec{background:#F5F5ED;color:#22161C;border:0;margin-top:10px}

/* Certificado (prévia) */
.cert{width:min(720px,100%);aspect-ratio:1.414;border-radius:var(--raio-2xl);background:#F5F5ED;color:#22161C;position:relative;overflow:hidden;padding:6% 7%;display:flex;flex-direction:column;box-shadow:var(--flutuante)}
.cert .faixa-c{position:absolute;right:0;top:0;bottom:0;width:28%;background:linear-gradient(160deg,var(--kd-cobalto),var(--kd-noite))}
.cert .faixa-c svg{position:absolute;left:50%;top:50%;width:70%;transform:translate(-50%,-50%)}
.cert .ct{margin-top:auto;max-width:64%}
.cert h2{font:300 clamp(24px,4.4vw,44px)/1 var(--fonte);letter-spacing:-.03em;margin:6px 0 12px}
.cert p{font:400 clamp(11px,1.5vw,14px)/1.6 var(--fonte);color:#5E5257}
.cert p b{color:#22161C;font-weight:600}
.cert .wm b{color:#22161C}
.cert .rodape{display:flex;gap:24px;max-width:64%;margin-top:auto;padding-top:16px;font:400 11px/16px var(--fonte);color:#5E5257}
.cert .rodape div{flex:1;border-top:1px solid #22161C;padding-top:6px}

/* Confete (ícones da marca) */
.confete{position:fixed;inset:0;pointer-events:none;z-index:160;overflow:hidden}
.confete span{position:absolute;top:-40px;animation:cai linear forwards}
@keyframes cai{to{transform:translateY(110vh) rotate(var(--r))}}

/* Responsivo */
.home-grid{display:grid;gap:0}
/* Home: KPIs alinhados ao banner · continue · editais | mentores */
.kpi-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 0 32px}
.kpi2{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:20px;border-radius:var(--raio-xl);background:var(--fundo-superficie);border:1px solid var(--borda-linha);transition:transform var(--mov-afundar) ease-out,box-shadow var(--mov-cor)}
.kpi2:hover{box-shadow:var(--flutuante)}
.kpi2:active{transform:scale(.985)}
.kx{display:flex;flex-direction:column;gap:4px;min-width:0}
.kt{font:600 18px/24px var(--fonte);letter-spacing:-.4px}
.km{font-size:32px;line-height:40px}
.tile{width:56px;height:56px;border-radius:var(--raio-l);display:grid;place-items:center;flex-shrink:0}
.t-bege{background:var(--kd-bege);color:#22161C}
.t-cob{background:var(--kd-cobalto);color:#F5F5ED}
.t-lar{background:color-mix(in srgb,var(--kd-laranja) 14%,transparent);color:var(--texto-laranja)}
.cont-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px}
.jornada.cont .cont-a,.jornada.cont .cont-b{display:flex;flex-direction:column;gap:16px}
.split{display:grid;gap:0;margin-top:8px}
.btn.pill{min-height:40px;border-radius:999px;font-size:12px;padding:0 14px;flex-shrink:0}
@media (max-width:719px){
  .kpi-row{gap:8px}
  .kpi2{flex-direction:column-reverse;padding:12px;gap:8px}
  .kt{font:400 12px/16px var(--fonte);letter-spacing:0;order:2}
  .km{font-size:24px;line-height:28px;order:1}
  .kd{display:none}
  .tile{width:40px;height:40px;border-radius:var(--raio-m)}
  .tile .ic{width:20px;height:20px}
}
@media (min-width:1024px){
  .jornada.cont{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,380px);gap:40px;align-items:end;padding:24px 28px}
  .split{grid-template-columns:minmax(0,1fr) 360px;margin-top:16px;border-top:1px solid var(--borda-linha)}
  .split-main{padding-right:28px;border-right:1px solid var(--borda-linha)}
  .split-side{padding-left:28px}
  .split .sec-h{margin-top:24px}
  .split .eds{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (min-width:1024px) and (max-width:1279px){ .split .eds{grid-template-columns:repeat(2,minmax(0,1fr))} }
.jor-grid{display:grid;gap:20px}
@media (min-width:720px){
  .eds{grid-template-columns:repeat(2,1fr)}
  .mentores{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
}
@media (min-width:1024px){
  .home-grid{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px;align-items:start}
  .home-grid .sec-h:first-child{margin-top:0}
  .jor-grid{grid-template-columns:minmax(0,1fr) 340px;gap:40px;align-items:start}
  .jor-aside{position:sticky;top:96px;display:flex;flex-direction:column;gap:16px}
  .eds{grid-template-columns:repeat(3,1fr)}
  .mentores{grid-template-columns:repeat(3,1fr)}
  .perfil-grid{display:grid;grid-template-columns:360px 1fr;gap:24px;align-items:start}
}
/* =====================================================================
   DEMO AUTOMÁTICA (cursor simulado) — qualquer interação real assume o controle
   ===================================================================== */
#conteudo:focus{outline:none}
.sim-cursor{position:fixed;left:0;top:0;width:30px;height:30px;z-index:400;pointer-events:none;will-change:transform;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.sim-cursor svg{width:100%;height:100%;transform-origin:4px 3px;transition:transform 90ms ease-out}
.sim-cursor.down svg{transform:scale(.82)}
.sim-ripple{position:fixed;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:999px;border:3px solid var(--kd-laranja);z-index:399;pointer-events:none;animation:simRip .5s ease-out forwards}
@keyframes simRip{from{transform:scale(.3);opacity:1}to{transform:scale(1.4);opacity:0}}
.sim-bar{position:fixed;left:50%;bottom:calc(101px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:300;display:flex;align-items:center;gap:10px;padding:6px 6px 6px 14px;border-radius:999px;background:var(--aviso-fundo);color:var(--aviso-texto);box-shadow:var(--flutuante);font:400 12px/16px var(--fonte);white-space:nowrap;max-width:calc(100% - 32px);animation:avisoIn var(--mov-tela) var(--curva-tela)}
.sim-bar b{font-weight:600}
.sim-bar .rec{width:8px;height:8px;border-radius:9px;background:var(--kd-laranja);animation:pulso 1.2s infinite;flex-shrink:0}
.sim-bar button{min-height:36px;padding:0 14px;border-radius:999px;font:600 12px/16px var(--fonte);background:color-mix(in srgb,var(--aviso-texto) 14%,transparent)}
.sim-bar .tx{overflow:hidden;text-overflow:ellipsis}
@media (min-width:1024px){.sim-bar{bottom:20px}}
/* estados de hover reproduzidos pelo cursor simulado */
.btn-pri.sim-hover{background:var(--acao-primaria);color:#22161C}
.btn-sec.sim-hover{border-color:var(--texto-apoio)}
.btn-hero.sim-hover{background:color-mix(in srgb,var(--ink2) 10%,transparent);border-color:var(--ink2)}
.btn-hero.sol.sim-hover{filter:brightness(1.12)}
.ed.sim-hover,.kpi2.sim-hover{box-shadow:var(--flutuante)}
.ed.sim-hover .capa-ed img{transform:scale(1.04)}
.nav-it.sim-hover .ic{color:var(--hv)}
.icon-btn.sim-hover{color:var(--kd-laranja)}
.item-ed.sim-hover,.li.sim-hover{background:color-mix(in srgb,var(--texto-principal) 4%,transparent)}
.sim-press{transform:scale(.97)!important;transition-duration:70ms!important}
.node.sim-press{transform:translate(var(--x,0),4px)!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:1ms!important;scroll-behavior:auto!important}
  .rw-badge .raios,.balao,.selo.vivo::before{animation:none!important}}
</style>

/* 60-30-10: fundo noite→cobalto (60) · letras em azuis (30) · uma letra laranja (10) */
const AZUIS = ["#CBE8FA","#6F8FF5"], ACENTO = "#FA4C03";
const contorno = c => c==="#CBE8FA" ? "rgba(18,9,62,.18)" : "rgba(255,255,255,.22)";
function letter(k, fill){
  const L = LETTERS[k];
  return `<svg viewBox="${L.vb}" aria-hidden="true" focusable="false"><use href="#L-${k}" fill="${fill}"/>${L.inner?`<use href="#L-${k}-in" fill="none" stroke="${contorno(fill)}" stroke-width="1.5"/>`:""}</svg>`;
}
function placed(k,x,y,w,fill,rot=0){
  const [, , vw, vh] = LETTERS[k].vb.split(" ").map(Number), s = w/vw;
  return `<g transform="translate(${x} ${y}) rotate(${rot} ${w/2} ${vh*s/2}) scale(${s})"><use href="#L-${k}" fill="${fill}"/>${LETTERS[k].inner?`<use href="#L-${k}-in" fill="none" stroke="${contorno(fill)}" stroke-width="${1.5/s}"/>`:""}</g>`;
}

}
// selo de 12 ondas (recompensa)
function sealPath(cx=80,cy=80,r1=54,r2=46,n=12){
  let d=""; for(let i=0;i<n*2;i++){ const a=i*Math.PI/n-Math.PI/2, r=i%2?r2:r1; d+=(i?"L":"M")+(cx+r*Math.cos(a)).toFixed(1)+" "+(cy+r*Math.sin(a)).toFixed(1); } return d+"Z";
}

  box.appendChild(el);

  const bye = () => { el.classList.add("out"); setTimeout(()=>el.remove(), 170); };
  const run = () => { t0 = Date.now(); tm = setTimeout(bye, left); };

}

function togglePop(i, force, restore){

}
function qr(){ let r="",s=11; const rnd=()=>(s=(s*9301+49297)%233280)/233280;
  for(let y=0;y<21;y++)for(let x=0;x<21;x++){ const f=(x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13); let on; if(f){const a=x>13?x-14:x,b=y>13?y-14:y; on=a===0||a===6||b===0||b===6||(a>1&&a<5&&b>1&&b<5);} else on=rnd()>.5; if(on) r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`; }
  return `<svg viewBox="0 0 21 21" style="width:100%;height:100%" role="img" aria-label="QR code do ingresso"><g fill="#22161C">${r}</g></svg>`; }
const enable = (btn, hint) => { btn.setAttribute("aria-disabled","false"); const h = $("#hint"); if(h) h.remove(); if(!RM) btn.animate([{transform:"scale(.96)"},{transform:"scale(1.02)"},{transform:"scale(1)"}],{duration:300,easing:"cubic-bezier(.34,1.56,.64,1)"}); };

  };

/* =====================================================================

   ===================================================================== */
let afterReward = null;
function completar(i){
  if(i!==state.done) return;
  clearTimers();
  const prev = state.done, partBefore = partDone(STEPS[i].p);
  state.done++; save();
  const fechouParte = !partBefore && partDone(STEPS[i].p);
  showPonto(i, fechouParte);
  afterReward = () => {
    location.hash = "#/jornada";
    setTimeout(()=>{ renderJornada({focus: allDone()? i : state.done}); view.className="view quiet";
      aviso(allDone()?"Jornada completa!":"Mandou bem! +1 ponto", allDone()?"Seu certificado de 40 h está liberado.":`Liberada: ${STEPS[state.done].title}`,
        {label:"Desfazer", fn:()=>{ state.done = prev; save(); renderJornada({focus:prev}); view.className="view quiet"; }}); }, 30);
  };
}
function showPonto(i, fechouParte){

  $("#swKiosk").onchange = e => setKiosk(e.target.checked);
  $("#pfSair").onclick = () => folha(`<h2 class="t-titulo" id="folhaT">Sair da conta?</h2><p class="t-corpo apoio">Seu progresso fica salvo. Você pode entrar de novo quando quiser.</p><button class="btn btn-pri" data-close>Continuar conectada${ic("seta-avancar")}</button><button class="btn btn-sec" data-close>Sair</button>`);
}
function resetDemo(){
  const snap = JSON.parse(JSON.stringify(state));
  state = fresh(); save(); route();
  aviso("Demo reiniciada", `Jornada de volta à etapa ${INITIAL_DONE+1}.`, {label:"Desfazer", fn:()=>{ state = snap; save(); route(); }});
}
$("#sideTheme").onclick = toggleTheme;
$("#sideReset").onclick = resetDemo;
document.querySelector(".skip").onclick = e => { e.preventDefault(); view.focus(); };

/* =====================================================================
   DEMO AUTOMÁTICA
   Um cursor simulado percorre os fluxos reais (cliques de verdade nos
   componentes). Qualquer interação real — mouse, toque, roda ou tecla —
   interrompe na hora e deixa a pessoa continuar de onde está.
   ===================================================================== */
const KIOSK_IDLE = 45000;
let kiosk = false; try{ kiosk = localStorage.getItem("kadoo-kiosk")==="1"; }catch(e){}
const SIM = {on:false, token:0, cursor:null, bar:null, pos:{x:innerWidth*.62, y:innerHeight*.55}, hover:null};
class Stop extends Error {}
const alive = t => { if(t!==SIM.token || !SIM.on) throw new Stop(); };
const nap = ms => { const t = SIM.token; return new Promise((res,rej)=>setTimeout(()=> (t===SIM.token && SIM.on) ? res() : rej(new Stop()), ms)); };
// primeiro elemento visível e interativo para o seletor
const vis = sel => [...document.querySelectorAll(sel)].find(e => e.getClientRects().length && !e.closest("[inert]"));
async function waitFor(sel, ms=5000){ const t0 = Date.now(); for(;;){ const el = typeof sel==="function" ? sel() : vis(sel); if(el) return el; if(Date.now()-t0>ms) throw new Error("não achei "+sel); await nap(80); } }
// quadro de animação com reserva: se o navegador não entregar frames (aba oculta, modo econômico), segue por timer
const frame = cb => { let ok = false; const id = requestAnimationFrame(t=>{ ok = true; cb(t); }); setTimeout(()=>{ if(!ok){ cancelAnimationFrame(id); cb(performance.now()); } }, 60); };
const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
function setHover(x, y){
  const hit = document.elementFromPoint(x, y);
  const el = hit && hit.closest(".btn,.btn-hero,.ed,.kpi2,.nav-it,.icon-btn,.item-ed,.li,.node,.dot,.chip,.aba,.tecla,.envio");
  if(el===SIM.hover) return;
  SIM.hover && SIM.hover.classList.remove("sim-hover"); SIM.hover = el; el && el.classList.add("sim-hover");
}
function placeCursor(){ SIM.cursor.style.transform = `translate(${SIM.pos.x}px,${SIM.pos.y}px)`; }
async function moveTo(sel, opt={}){
  const el = await waitFor(sel);
  let r = el.getBoundingClientRect();
  const top = innerWidth>=1024 ? 90 : 80, bottom = innerHeight - (innerWidth>=1024 ? 130 : 170);  // não deixa a barra da demo cobrir o alvo
  if(r.top < top || r.bottom > bottom){ el.scrollIntoView({behavior:smooth, block:"center"}); await nap(RM?60:650); r = el.getBoundingClientRect(); }
  const tx = r.left + r.width*(opt.fx ?? .5) + (Math.random()*6-3), ty = r.top + r.height*(opt.fy ?? .5) + (Math.random()*4-2);
  const from = {...SIM.pos}, dist = Math.hypot(tx-from.x, ty-from.y);
  const dur = RM ? 1 : Math.min(1100, Math.max(380, dist*1.1));
  const t = SIM.token, t0 = performance.now();
  await new Promise((res, rej) => { const step = now => {
    if(t!==SIM.token || !SIM.on) return rej(new Stop());
    const k = Math.min(1,(now-t0)/dur), e = ease(k);
    // curva leve, como uma mão de verdade
    const arc = Math.sin(k*Math.PI) * Math.min(40, dist*.08);
    SIM.pos = {x: from.x+(tx-from.x)*e, y: from.y+(ty-from.y)*e - arc};
    placeCursor(); setHover(SIM.pos.x, SIM.pos.y);
    k<1 ? frame(step) : res(); }; frame(step); });
  return el;
}
async function tap(sel, opt){
  const el = await moveTo(sel, opt); await nap(opt?.pause ?? 180);
  SIM.cursor.classList.add("down"); el.classList.add("sim-press");
  const rp = document.createElement("span"); rp.className = "sim-ripple"; rp.style.left = SIM.pos.x+"px"; rp.style.top = SIM.pos.y+"px"; document.body.appendChild(rp); setTimeout(()=>rp.remove(), 600);
  await nap(110);
  SIM.cursor.classList.remove("down"); el.classList.remove("sim-press");
  el.click();
  await nap(220);
  return el;
}
async function typeIn(sel, text){
  await tap(sel);
  for(const ch of text){ const el = await waitFor(sel); el.value += ch; el.dispatchEvent(new Event("input", {bubbles:true})); await nap(130 + Math.random()*90); }
}
async function clearIn(sel){ const el = await waitFor(sel); while(el.value){ const e2 = await waitFor(sel); e2.value = e2.value.slice(0,-1); e2.dispatchEvent(new Event("input",{bubbles:true})); await nap(60); if(!e2.value) break; } }
const go = async h => { if(location.hash!==h){ location.hash = h; } await nap(RM?100:700); };
const navTo = async h => { await tap(`.nav-it[href="${h}"]`); await nap(900); };

// roteiro: o que a demo mostra, em ordem (volta sempre do mesmo ponto)
async function roteiro(){
  state = fresh(); save(); edF = {q:"",cats:[],aba:"open"}; mQ = "";
  closeFolha(false); closeReward(false);
  await go("#/inicio"); window.scrollTo({top:0}); await nap(1200);
  // banners passando
  await tap(".dot[data-i='1']"); await nap(2200);
  await tap(".dot[data-i='2']"); await nap(2200);
  await tap(".dot[data-i='0']"); await nap(900);
  // KPIs, card da jornada, editais e mentores
  await moveTo(".kpi2:nth-child(1)"); await nap(600);
  await moveTo(".kpi2:nth-child(2)"); await nap(500);
  await moveTo(".kpi2:nth-child(3)"); await nap(500);
  await moveTo(".jornada.cont .btn-pri"); await nap(900);
  await moveTo(".split .ed:nth-child(1)", {fy:.35}); await nap(700);
  await moveTo(".split .ed:nth-child(3)", {fy:.35}); await nap(700);
  await moveTo(".split [data-m]"); await nap(600);
  // jornada: trilha, cartão da etapa e etapa atual
  await tap(".btn-hero.sol"); await nap(1300);
  await tap("[data-node='2']"); await nap(1600);
  await tap(`[data-node='${state.done}']`); await nap(1100);
  await tap(`#pop${state.done} .btn-pri`); await nap(1400);
  // etapa: tenta concluir (botão explica o que falta), assiste e conclui
  await tap("#acao"); await nap(900);
  await tap("#playBtn"); await waitFor(()=>{ const a=$("#acao"); return a && a.getAttribute("aria-disabled")==="false" && a; }, 8000); await nap(500);
  await tap("#acao"); await nap(RM?400:2300);               // recompensa +1 ponto
  await tap("#rwGo"); await nap(2000);                       // volta à jornada com a próxima liberada
  // editais: busca, filtro sem resultado, limpar e inscrição
  await navTo("#/editais");
  await typeIn("#qEd", "tech"); await nap(1200);
  await clearIn("#qEd"); await nap(500);
  await tap("[data-cat='Games']"); await nap(1300);
  await tap("#limpar"); await nap(900);
  await tap("[data-aba='prog']"); await nap(1100);
  await tap("[data-aba='open']"); await nap(800);
  await tap(".ed[data-slug='educacao-tech']", {fy:.3}); await nap(1800);
  // mentores: busca e perfil
  await navTo("#/mentores");
  await typeIn("#qM", "ana"); await nap(1000);
  await tap("[data-m]"); await nap(2200);
  await tap("#folha [data-close]"); await nap(700);
  // perfil: conquistas e tema escuro
  await navTo("#/perfil");
  await moveTo(".galeria .badge"); await nap(900);
  await tap("#swTema"); await nap(2200);
  await tap("#swTema"); await nap(1000);
  await navTo("#/inicio"); window.scrollTo({top:0,behavior:smooth}); await nap(2500);
}
async function loopSim(){
  while(SIM.on){
    try{ await roteiro(); }
    catch(e){ if(e instanceof Stop) return; console.warn("demo:", e.message); await new Promise(r=>setTimeout(r,800)); }
  }
}
function startSim(){
  if(SIM.on) return;
  SIM.on = true; SIM.token++; SIM.grace = Date.now() + 2500; lastReal = null;
  clearTimeout(idleT);
  SIM.cursor = document.createElement("div"); SIM.cursor.className = "sim-cursor"; SIM.cursor.setAttribute("aria-hidden","true");
  SIM.cursor.innerHTML = `<svg viewBox="0 0 24 24"><path d="M4 2.5l15.5 8.2-6.9 1.7-3.2 6.6L4 2.5z" fill="#22161C" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
  document.body.appendChild(SIM.cursor); placeCursor();
  SIM.bar = document.createElement("div"); SIM.bar.className = "sim-bar"; SIM.bar.setAttribute("role","status");
  SIM.bar.innerHTML = `<span class="rec" aria-hidden="true"></span><span class="tx"><b>Demonstração automática</b> · mexa o mouse ou toque para assumir</span><button type="button">Parar</button>`;
  document.body.appendChild(SIM.bar);
  SIM.bar.querySelector("button").onclick = () => stopSim(true);
  loopSim();
}
function stopSim(byUser){
  if(!SIM.on) return;
  SIM.on = false; SIM.token++;
  SIM.cursor && SIM.cursor.remove(); SIM.bar && SIM.bar.remove();
  SIM.hover && SIM.hover.classList.remove("sim-hover"); SIM.hover = null;
  document.querySelectorAll(".sim-press").forEach(e=>e.classList.remove("sim-press"));
  if(byUser) aviso("Você está no controle", kiosk ? `A demo volta sozinha após ${KIOSK_IDLE/1000} s sem uso.` : "Use “Demo automática” no menu para ver de novo.");
  armIdle();
}
// interação real (isTrusted) assume o controle; o cursor simulado nunca dispara esses eventos
let lastReal = null, idleT = null;
function armIdle(){ clearTimeout(idleT); if(kiosk && !SIM.on) idleT = setTimeout(startSim, KIOSK_IDLE); }
function onReal(e){
  if(!e.isTrusted) return;
  if(e.type==="mousemove"){
    const p = {x:e.screenX, y:e.screenY};
    const moved = lastReal && Math.hypot(p.x-lastReal.x, p.y-lastReal.y) > 24;  // ignora "mousemove" gerado por rolagem e tremidas
    if(!lastReal || moved) lastReal = p;
    if(!moved) return;
  }
  if(e.type==="keydown" && !SIM.on && (e.key==="d"||e.key==="D") && !e.target.closest("input,textarea") && !e.ctrlKey && !e.metaKey && !e.altKey){ startSim(); return; }
  if(SIM.on){ if(Date.now() < SIM.grace){ if(e.type==="mousemove") lastReal = null; return; } stopSim(true); return; }
  armIdle();
}
["mousemove","pointerdown","touchstart","wheel","keydown"].forEach(t => addEventListener(t, onReal, {passive:true, capture:true}));
function setKiosk(on){ kiosk = on; try{ localStorage.setItem("kadoo-kiosk", on?"1":"0"); }catch(e){} aviso(on?"Modo evento ligado":"Modo evento desligado", on?`A demo começa sozinha após ${KIOSK_IDLE/1000} s sem uso.`:"A demo só roda quando você mandar."); armIdle(); }
$("#sideDemo").onclick = () => startSim();
// ?demo inicia direto; ?evento liga o modo evento
const qs = new URLSearchParams(location.search);
if(qs.has("evento")) { kiosk = true; try{ localStorage.setItem("kadoo-kiosk","1"); }catch(e){} }
route();
armIdle();
if(qs.has("demo") || qs.has("evento")) setTimeout(startSim, 1200);
</script>
